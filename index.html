<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Solmere</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23e8484a'/><rect x='1' y='7' width='14' height='2' fill='%23222'/><circle cx='8' cy='8' r='2.5' fill='%23fff' stroke='%23222'/></svg>">
<style>
  /* SolPix: Latin subsets of the Galmuri pixel font (OFL; see fonts/OFL-Galmuri.txt, tools/build_fonts.py) */
  @font-face { font-family: 'SolPix7'; src: url(fonts/SolPix7.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'SolPix9'; src: url(fonts/SolPix9.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'SolPix11'; src: url(fonts/SolPix11.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'SolPix11B'; src: url(fonts/SolPix11B.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'SolPix14'; src: url(fonts/SolPix14.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #game { position: relative; z-index: 1; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ff { position: fixed; top: 6px; left: calc(50% - 64px); z-index: 5; padding: 6px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(16,20,32,.55); color: #fff; font: 700 13px "Avenir Next", sans-serif; letter-spacing: .04em; cursor: pointer; opacity: .55; transition: opacity .15s, background .15s; user-select: none; }
  #ff:hover { opacity: 1; }
  #sc { position: fixed; top: 6px; left: calc(50% - 10px); z-index: 5; padding: 6px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(16,20,32,.55); color: #fff; font: 700 11px "Avenir Next", sans-serif; letter-spacing: .08em; cursor: pointer; opacity: .45; }
  #sc:hover { opacity: 1; }
  #dim { position: fixed; top: 6px; left: calc(50% + 88px); z-index: 5; min-width: 40px; padding: 6px 9px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(16,20,32,.55); color: #fff; font: 800 11px "Avenir Next", sans-serif; letter-spacing: .08em; cursor: pointer; opacity: .5; user-select: none; }
  #dim:hover { opacity: 1; }
  #dim.on { background: rgba(80,200,210,.85); color: #06201f; border-color: rgba(255,255,255,.6); }
  #ff.on { background: rgba(255,196,40,.9); color: #1a1405; opacity: .95; border-color: rgba(255,255,255,.6); }
  /* loading screen: pixel art on a small canvas, scaled up by whole pixels (drawn by the script below) */
  #boot { position: fixed; inset: 0; z-index: 10; background: #070b1c; display: flex; align-items: center; justify-content: center; transition: opacity .45s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<div id="boot"><canvas width="240" height="135"></canvas></div>
<script>
  // Loading screen, in the game's own pixel style: a night sea under a lighthouse whose beam sweeps round,
  // the SOLMERE wordmark, a segmented progress bar and rotating tips in the pixel font. 240x135, scaled up
  // by whole pixels. Progress is set as each part of the game finishes loading.
  (function () {
    const root = document.getElementById('boot'), cv = root.querySelector('canvas'), c = cv.getContext('2d'), W = 240, H = 135;
    const tips = ['Hold Shift to run. In water, hold it to swim fast.', 'Tab fast-forwards everything.', 'Your lead Echo walks behind you. Talk to it!', 'Walk into weak wild Echoes to Sweep them.', 'The 3D / 2D button up top switches the view.', 'Every town has a Haven: teal roof, a heart on a wave.'];
    const GL = { S: ['.#####.', '##...##', '##.....', '.#####.', '.....##', '##...##', '.#####.'], O: ['..###..', '.#####.', '#######', '.......', '#######', '.......', '..###..'],
      L: ['##.....', '##.....', '##.....', '##.....', '##.....', '##.....', '######.'], M: ['##...##', '###.###', '#######', '##.#.##', '##...##', '##...##', '##...##'],
      E: ['######', '##....', '##....', '#####.', '##....', '##....', '######'], R: ['######.', '##...##', '##...##', '######.', '##.##..', '##..##.', '##...##'] };
    const FACE = ['#fff6d0', '#ffe590', '#ffcc62', '#ffae50', '#ff8c4c', '#f06a5a', '#d44e6e'], SUN = ['#fff4a8', '#ffd660', '#ffb04a', '#ff8a4c', '#ff6a60', '#f8527c', '#e84e84'];
    let prog = .04, shown = .04, tip = 0, t = 0, fontOK = false;
    window._bootProgress = f => { prog = Math.max(prog, f); };
    try { document.fonts.load('9px SolPix9').then(() => { fontOK = true; }); } catch (e) { }
    const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); };
    const h2 = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
    function fit() {
      const k = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
      cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px';
    }
    addEventListener('resize', fit); fit();
    function word(cx, y0) {
      const text = 'SOLMERE', cells = [], Z = 2;
      const x0 = Math.round(cx / Z - 29);
      let x = x0;
      for (let li = 0; li < text.length; li++) {
        const g = GL[text[li]], bob = Math.round(Math.sin(t / 22 - li * .8) * .7);
        for (let y = 0; y < 7; y++) for (let xx = 0; xx < g[y].length; xx++) if (g[y][xx] === '#') cells.push([x + xx + Math.floor((6 - y) / 3), y0 + y + bob, y, text[li] === 'O']);
        x += g[0].length + 1;
      }
      const key = new Set(cells.map(q => q[0] + ',' + q[1]));
      const P = (x, y, col) => px(x * Z, y * Z, Z, Z, col);
      for (const [x, y] of cells) for (let dy = -1; dy <= 2; dy++) for (let dx = -1; dx <= 1; dx++) if (!key.has((x + dx) + ',' + (y + dy))) P(x + dx, y + dy, '#1a0818');   // outline
      for (const [x, y] of cells) { if (!key.has(x + ',' + (y + 1))) P(x, y + 1, '#7a2456'); }   // extrusion
      const gp = (t % 240) * .7 - 20;
      for (const [x, y, row, sun] of cells) { const g = x + row * .6 - gp; P(x, y, g > 0 && g < 2.5 ? '#ffffff' : !key.has(x + ',' + (y - 1)) ? '#fffbe8' : (sun ? SUN : FACE)[row]); }
    }
    function frame() {
      if (root.classList.contains('done') || !root.isConnected) return;
      t++; shown += (prog - shown) * .12;
      // sky in stepped bands, dithered at each step
      const SKY = ['#070b1c', '#0a1026', '#0e1630', '#131c3c', '#1a2448', '#212c54', '#2a3460'];
      for (let y = 0; y < 86; y++) { const f = y / 86 * (SKY.length - 1), i = Math.floor(f), fr = f - i; for (let x = 0; x < W; x++) px(x, y, 1, 1, SKY[Math.min(SKY.length - 1, i + ((fr > .5 && (x + y) % 2) || fr > .85 ? 1 : 0))]); }
      for (let i = 0; i < 46; i++) { const x = Math.floor(h2(i, 1) * W), y = Math.floor(h2(i, 2) * 80), tw = Math.sin(t / 18 + i * 1.7); if (tw > -.3) px(x, y, 1, 1, tw > .7 ? '#ffffff' : '#8a9ac8'); if (tw > .95 && i % 5 === 0) { px(x - 1, y, 1, 1, '#8a9ac8'); px(x + 1, y, 1, 1, '#8a9ac8'); px(x, y - 1, 1, 1, '#8a9ac8'); px(x, y + 1, 1, 1, '#8a9ac8'); } }
      // moon
      for (let y = -6; y <= 6; y++) for (let x = -6; x <= 6; x++) { const d = x * x + y * y; if (d <= 36) px(38 + x, 22 + y, 1, 1, d > 28 ? '#c8d0f0' : (x + y > 3 ? '#e8ecff' : '#fffdf0')); }
      // far islands
      for (let x = 0; x < W; x++) { const hh = Math.max(0, Math.round(5 * Math.sin(x / 13) + 3 * Math.sin(x / 5 + 2) - 2)); if (x < 90 || x > 150) px(x, 86 - hh, 1, hh, '#10142a'); }
      // the sea: stepped bands and rolling crests, the lamp's reflection wobbling on it
      for (let y = 86; y < H; y++) { const k = (y - 86) / (H - 86); px(0, y, W, 1, k < .2 ? '#1a2a58' : k < .45 ? '#14224a' : k < .7 ? '#0e1a3c' : '#0a1330'); }
      for (let row = 0; row < 7; row++) { const y = 89 + row * 6 + row * row * .3, sp = 5 + row * 2, off = (t * (.3 + row * .12)) % (sp * 4); for (let x = -sp * 4; x < W; x += sp * 4) { const X = Math.round(x + off + (row % 2) * sp * 2); px(X, y, sp, 1, row < 2 ? '#3a5a98' : '#2a4a86'); if (row > 2) px(X + 1, y - 1, sp - 2, 1, '#5a7ac0'); } }
      for (let y = 88; y < H; y += 2) { const w = 2 + (y - 88) * .08, wob = Math.round(Math.sin(t / 10 + y) * 1.5); c.globalAlpha = .5 - (y - 88) / 120; px(196 - w / 2 + wob, y, w, 1, '#ffe6a0'); }
      c.globalAlpha = 1;
      // lighthouse on its rock, lamp and a stepped beam sweeping round
      const LX = 196, LB = 94;
      for (let y = 0; y < 9; y++) { const w = 10 + y * 3 + (y % 2); px(LX - w / 2, LB - 5 + y, w, 1, y < 2 ? '#3a2838' : '#1c1422'); if (y < 6) px(LX - w / 2, LB - 5 + y, 2, 1, '#6a4a5a'); }
      for (let x = -15; x < 16; x += 3) if (Math.sin(t / 12 + x) > 0) px(LX + x, LB + 4, 2, 1, '#c8dcff');   // foam at its foot
      for (let y = 0; y < 34; y++) { const w = 7 - Math.floor(y / 12); px(LX - w / 2, LB - 4 - y, w, 1, Math.floor(y / 6) % 2 ? '#e8e2ee' : '#c83a48'); px(LX + w / 2 - 1, LB - 4 - y, 1, 1, Math.floor(y / 6) % 2 ? '#a89cb0' : '#8a2434'); }
      px(LX - 5, LB - 40, 10, 2, '#2a2838'); px(LX - 3, LB - 46, 6, 6, '#ffe6a0'); px(LX - 4, LB - 48, 8, 2, '#c83a48'); px(LX - 2, LB - 50, 4, 2, '#c83a48'); px(LX, LB - 52, 1, 2, '#2a2838');
      const ang = Math.sin(t / 90) * 1.1 + Math.PI, lx = LX, ly = LB - 43;
      for (let r = 6; r < 160; r += 1) { const sp = r * .16 + 1, a = Math.max(0, .16 - r / 1100); if (a <= 0) break; const cx = lx + Math.cos(ang) * r, cy = ly + Math.sin(ang) * r * .35;
        c.globalAlpha = Math.round(a * 16) / 16; px(cx, cy - sp * .35, 1, Math.max(1, sp * .7), '#fff4d8'); }
      c.globalAlpha = 1;
      for (const [r, a] of [[9, .12], [6, .2], [4, .35]]) { c.globalAlpha = a; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) px(lx + x, ly + y, 1, 1, '#fff0c0'); }
      c.globalAlpha = 1;
      c.globalAlpha = 1;
      // wordmark, a bobbing orb, the bar, the tip
      word(W / 2, 9);
      const oy = 70 + Math.round(Math.sin(t / 20) * 1.5);
      for (let y = -5; y <= 5; y++) for (let x = -5; x <= 5; x++) { const d = x * x + y * y; if (d <= 25) px(120 + x, oy + y, 1, 1, d > 19 ? '#0e4a66' : (x < -1 && y < -1 ? '#ffffff' : x + y < 2 ? '#8af0e0' : '#2fb8c8')); }
      px(113, oy, 15, 1, '#d8a84a');
      const BX = 70, BY = 106, BW = 100, seg = 20, lit = Math.round(shown * seg);
      px(BX - 2, BY - 2, BW + 4, 8, '#1a0818'); px(BX - 1, BY - 1, BW + 2, 6, '#2a3050');
      for (let i = 0; i < seg; i++) { const on = i < lit; px(BX + i * 5, BY, 4, 4, on ? (i === lit - 1 && t % 20 < 10 ? '#ffffff' : '#8af0e0') : '#161a30'); if (on) px(BX + i * 5, BY, 4, 1, '#d8fff8'); }
      if (t % 150 === 0) tip++;
      const tt = tips[tip % tips.length], fa = Math.min(1, (t % 150) / 12, (150 - t % 150) / 12);
      c.globalAlpha = fa; c.fillStyle = '#9fb4c8'; c.textAlign = 'center'; c.textBaseline = 'top';
      c.font = fontOK ? '9px SolPix9' : '8px monospace'; c.fillText(tt, W / 2, 116); c.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    c.imageSmoothingEnabled = false;
    requestAnimationFrame(frame);
  })();
</script>

<script>
  (function () {
    try {
      G.persist.globalSettings();
      G.gfx.fill = !!G.settings.fill;
      G.boot();
      // Showcase from anywhere (cutscenes, battles): reload straight into the Showcase menu
      const toShowcase = () => { location.href = location.pathname + '?tour' + (/[?&]mute\b/.test(location.search) ? '&mute' : ''); };
      document.getElementById('sc').addEventListener('click', ev => { ev.preventDefault(); toShowcase(); });
      // 2D / 3D world switch: the top-bar button and F3
      const dimBtn = document.getElementById('dim');
      const syncDim = () => { const on = !!G.settings.render3d; dimBtn.textContent = on ? '3D' : '2D'; dimBtn.classList.toggle('on', on); };
      const toggle3d = () => { G.settings.render3d = !G.settings.render3d; G.toast(G.settings.render3d ? '3D world' : '2D world  (classic top-down)', { life: 70 }); try { G.persist.saveSettings(); } catch (e) {} syncDim(); };
      syncDim(); setInterval(syncDim, 500);   // also follows the Options menu
      dimBtn.addEventListener('click', ev => { ev.preventDefault(); toggle3d(); ev.currentTarget.blur(); });
      window.addEventListener('keydown', ev => { if (ev.code === 'F1') { ev.preventDefault(); toShowcase(); } if (ev.code === 'F3') { ev.preventDefault(); toggle3d(); } });
      document.getElementById('ff').addEventListener('click', ev => { ev.preventDefault(); G.setTurbo(!G.turbo); G.ffButton = G.turbo; ev.currentTarget.blur(); });
      // right-click the button to step through speeds: 2x … 24x
      document.getElementById('ff').addEventListener('contextmenu', ev => { ev.preventDefault(); const V = [2, 3, 4, 6, 8, 12, 16, 24]; const i = V.indexOf(G.ffSpeed()); G.settings.ffSpeed = V[(i + 1) % V.length]; G.setTurbo(true); G.ffButton = true; });
      // the sprite atlas is an embedded image: decode it before the title shows
      const parts = [G.monArt.load(), G.chars.load(), G.tiles.loadWorld(), G.loadFonts()]; let doneN = 0;
      parts.forEach(p => Promise.resolve(p).then(() => window._bootProgress && window._bootProgress(++doneN / parts.length)));
      Promise.all(parts).then(() => { G.loadBattleArt && G.loadBattleArt(); G.itemHD && G.itemHD("potion"); G.push(new G.TitleScene()); const bt = document.getElementById('boot'); clearInterval(window._bootTips); bt.classList.add('done'); setTimeout(() => bt.remove(), 500); if (/[?&]showcase\b/.test(location.search)) { history.replaceState(null, '', location.pathname); G.run(() => G.openShowcase()); } else if (/[?&]tour\b/.test(location.search)) { history.replaceState(null, '', location.pathname); G.run(() => G.runTour()); } });
      window.addEventListener('beforeunload', () => { try { G.persist.saveSettings(); } catch (e) {} });
    } catch (e) {
      { clearInterval(window._bootTips); const tip = document.querySelector('#boot .tip'); if (tip) { tip.style.opacity = 1; tip.style.color = '#ff9aa6'; tip.textContent = 'Failed to start: ' + e.message; } else document.getElementById('boot').textContent = 'Failed to start: ' + e.message; }
      console.error(e);
    }
  })();
</script>
